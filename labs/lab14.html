<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            font-family: Helvetica, sans-serif;
            text-align: center;
            background-color: antiquewhite;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 400px;
            margin: 20px auto;
            padding: 20px;
            background-color: lightseagreen;
            border-radius: 12px;
            box-shadow: 0 4px 12px;
        }

        #userPicture {
            width: 200px;
            height: 200px;
            border-radius: 20px;
        }

        #generateButton {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 2px 2px;
            background-color: yellowgreen;

        }

    </style>
</head>
<body>

    <button id="generateButton">Generate Profile </button>

    <div id="card">
    
        <img id="userPicture" src="" alt="User Picture">
        <h2 id="userName"></h2>
        <p id="userEmail"></p>
        <p id="userPhone"></p>

    </div>

    <script>
        
        async function getUser() {
            const response = await fetch("https://randomuser.me/api/");
            const data = await response.json();
            const user = data.results[0];
            console.log(user);
            document.getElementById("userPicture").src = user.picture.large;
            document.getElementById("userName").textContent = `${user.name.first} ${user.name.last}`;
            document.getElementById("userEmail").textContent = `Email: ${user.email}`;
            document.getElementById("userPhone").textContent = `Phone Number: ${user.phone}`;

        }
        getUser();

        document.getElementById("generateButton").addEventListener("click", getUser);


    </script>
    
</body>
</html>
